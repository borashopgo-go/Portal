<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Clientas | BoraShop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>💜 BoraShop - Portal de Pedidos</h1>
  </header>

  <main class="container">
        <!-- Buscador por Nombre o Teléfono -->
    <section class="card search-card">
      <h2>Ingresa a tu Portal</h2>
      <div class="search-group">
        <input type="text" id="userInput" placeholder="Ingresa tu nombre completo o teléfono..." required>
        <button onclick="cargarPortal()" class="btn-primary">Buscar Pedidos</button>
      </div>
    </section>


    <div id="portalContent" style="display: none;">
      <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('pedidosTab')">📦 Mis Pedidos</button>
        <button class="tab-btn" onclick="switchTab('enviosTab')">✈️ Cotizar y Solicitar Envío</button>
      </nav>

      <section id="pedidosTab" class="tab-content active">
        <div class="actions-bar">
          <h3>Tus Artículos</h3>
          <button onclick="abrirModalPagoMultiples()" class="btn-secondary">
            💳 Registrar Pago Múltiple
          </button>
        </div>
        <div id="ordersList" class="orders-grid"></div>
      </section>

      <section id="enviosTab" class="tab-content">
        <h3>Consolidación y Cotización de Envío</h3>
        <p>Selecciona los artículos en almacén que deseas juntar en un solo paquete:</p>
        <div id="shippingList" class="shipping-grid"></div>

        <div class="shipping-summary card">
          <h4>Resumen de Consolidación</h4>
          <p>Artículos seleccionados: <strong id="selectedCount">0</strong></p>
          <p>Peso Total Estimado: <strong id="totalWeight">0 g</strong> (<span id="totalKg">0 kg</span>)</p>
          
          <div class="form-group">
            <label for="shippingAddress">Dirección o Sucursal de Entrega:</label>
            <textarea id="shippingAddress" rows="2" placeholder="Ingresa tu dirección completa o datos de sucursal..."></textarea>
          </div>

          <button onclick="enviarSolicitudEnvio()" class="btn-primary">
            🚀 Solicitar Cotización de Envío
          </button>
        </div>
      </section>
    </div>
  </main>

  <div id="paymentModal" class="modal" style="display: none;">
    <div class="modal-content card">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h2>Registrar Pago / Abono</h2>
      
      <form id="paymentForm" onsubmit="guardarPago(event)">
        <div id="selectedItemsNotice" class="notice-box"></div>

        <div class="form-group">
          <label for="paymentType">Tipo de Pago:</label>
          <select id="paymentType" required>
            <option value="Abono a Producto">Abono a Producto</option>
            <option value="Cargo EMS">Cargo EMS / Envío Internacional</option>
            <option value="Cargo Aduanal">Cargo Aduanal</option>
            <option value="Envío Local / Nacional">Envío Local / Nacional</option>
          </select>
        </div>

        <div class="form-group">
          <label for="amount">Monto Transferido ($ MXN):</label>
          <input type="number" id="amount" step="0.01" min="1" placeholder="Ej. 250.00" required>
        </div>

        <div class="form-group">
          <label for="receiptLink">Enlace o Foto del Comprobante (URL):</label>
          <input type="url" id="receiptLink" placeholder="https://..." required>
        </div>

        <button type="submit" class="btn-primary">Enviar Comprobante</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
